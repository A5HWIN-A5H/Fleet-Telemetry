name: API Quality Gate

# Trigger this pipeline every time code is pushed to the main branch
on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
    # 1. Grab the code from your repository
    - name: Checkout Repository
      uses: actions/checkout@v4

    # 2. Set up the Node environment
    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '22'

    # 3. Install the project dependencies
    - name: Install Dependencies
      run: npm install

    # 4. Run the automated test suite with coverage
    - name: Run Automated Tests
      run: npm run test:ci